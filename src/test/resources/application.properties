# Test configuration for running Spring tests without PostgreSQL
spring.datasource.url=jdbc:h2:mem:ai_engineering_workspace_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=test-secret-key-for-unit-tests-1234567890
jwt.expiration=3600000
