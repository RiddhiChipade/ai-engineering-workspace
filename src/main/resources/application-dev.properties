spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_engineering_workspace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

jwt.secret=${JWT_SECRET:change-this-secret-in-production}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Redis cache
spring.cache.type=redis
spring.cache.redis.time-to-live=PT60S
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

# Kafka (dev)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka.task.topic=${KAFKA_TASK_TOPIC:task-events}

kafka.enabled=${KAFKA_ENABLED:true}
